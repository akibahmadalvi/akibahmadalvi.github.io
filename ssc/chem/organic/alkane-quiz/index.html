<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon Nomenclature Quiz - Ordered Randomization</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f1f5f9;
        }

        .cherry-red {
            background-color: #D2122E !important; /* Cherry Red */
            border-color: #D2122E !important;
            color: white !important;
        }

        .success-green {
            background-color: #22c55e !important; /* Green 500 */
            border-color: #22c55e !important;
            color: white !important;
        }

        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div id="app" class="w-full max-w-md glass-card rounded-3xl shadow-2xl p-6 md:p-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">ChemQuiz</h1>
                <p id="progress-text" class="text-xs text-slate-400 uppercase tracking-widest font-semibold">Question 1/24</p>
            </div>
            <div class="text-sm font-bold px-4 py-2 bg-blue-500/10 text-blue-400 border border-blue-500/20 rounded-xl">
                Score: <span id="score">0</span>
            </div>
        </div>

        <!-- Question Section -->
        <div id="quiz-container">
            <div class="mb-8">
                <p id="question-text" class="text-xl font-medium text-slate-100 leading-relaxed min-h-[80px]">
                    Preparing your deck...
                </p>
            </div>

            <!-- Options -->
            <div id="options-grid" class="grid grid-cols-1 gap-4">
                <!-- Options will be injected here -->
            </div>

            <!-- Feedback Message -->
            <div id="feedback" class="mt-8 p-4 rounded-2xl text-center font-bold text-sm hidden"></div>

            <!-- Control Button -->
            <button id="next-btn" class="hidden w-full mt-8 py-4 bg-white text-slate-900 rounded-2xl font-bold hover:bg-slate-200 active:scale-[0.98] transition-all shadow-xl">
                Continue →
            </button>
        </div>
    </div>

    <script>
        const carbonData = [
            { carbons: 1, name: "Methane" },
            { carbons: 2, name: "Ethane" },
            { carbons: 3, name: "Propane" },
            { carbons: 4, name: "Butane" },
            { carbons: 5, name: "Pentane" },
            { carbons: 6, name: "Hexane" },
            { carbons: 7, name: "Heptane" },
            { carbons: 8, name: "Octane" },
            { carbons: 9, name: "Nonane" },
            { carbons: 10, name: "Decane" },
            { carbons: 11, name: "Undecane" },
            { carbons: 12, name: "Dodecane" }
        ];

        let questionDeck = [];
        let currentQuestion = null;
        let score = 0;
        let totalAnswered = 0;
        let hasAnswered = false;

        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score');
        const feedback = document.getElementById('feedback');
        const progressText = document.getElementById('progress-text');

        // Create a pool of 24 unique questions (12 types of A, 12 types of B)
        function createDeck() {
            let deck = [];
            carbonData.forEach((item, index) => {
                // Type 0: Name to Count
                deck.push({ carbonIndex: index, type: 0 });
                // Type 1: Count to Name
                deck.push({ carbonIndex: index, type: 1 });
            });
            
            // Shuffle the deck using Fisher-Yates algorithm
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function initQuiz() {
            questionDeck = createDeck();
            generateQuestion();
        }

        function generateQuestion() {
            // If deck is empty, start a new cycle
            if (questionDeck.length === 0) {
                questionDeck = createDeck();
            }

            hasAnswered = false;
            nextBtn.classList.add('hidden');
            feedback.classList.add('hidden');
            
            // Draw the next question from our unique shuffled pool
            const questionSpec = questionDeck.pop();
            const target = carbonData[questionSpec.carbonIndex];
            const type = questionSpec.type;
            
            let questionHtml = "";
            let correctAnswer = "";
            let options = [];

            if (type === 0) {
                // Name to Carbon Count
                questionHtml = `<span class="text-blue-400 font-bold">${target.name}</span> has —`;
                correctAnswer = `${target.carbons} Carbon${target.carbons > 1 ? 's' : ''}`;
                
                const distractors = carbonData
                    .filter(c => c.carbons !== target.carbons)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(c => `${c.carbons} Carbon${c.carbons > 1 ? 's' : ''}`);
                
                options = [correctAnswer, ...distractors];
            } else {
                // Carbon Count to Name
                questionHtml = `<span class="text-blue-400 font-bold">${target.carbons} carbon</span> Alkane is —`;
                correctAnswer = target.name;
                
                const distractors = carbonData
                    .filter(c => c.name !== target.name)
                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3)
                    .map(c => c.name);
                
                options = [correctAnswer, ...distractors];
            }

            // Shuffle option buttons
            options.sort(() => 0.5 - Math.random());

            currentQuestion = { correctAnswer };
            
            // Update Progress Tracking UI
            const currentCountInCycle = 24 - questionDeck.length;
            progressText.innerText = `Question ${currentCountInCycle}/24`;

            renderUI(questionHtml, options);
        }

        function renderUI(html, options) {
            questionText.innerHTML = html;
            optionsGrid.innerHTML = '';

            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full p-4 text-left border border-slate-700 rounded-2xl bg-slate-800/50 hover:bg-slate-700/50 hover:border-slate-500 font-medium text-slate-200 shadow-sm";
                btn.innerText = option;
                btn.onclick = () => handleAnswer(btn);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const selectedValue = selectedBtn.innerText.trim();
            const correctValue = currentQuestion.correctAnswer.trim();
            const isCorrect = selectedValue === correctValue;
            
            if (isCorrect) {
                score++;
                scoreDisplay.innerText = score;
                selectedBtn.classList.add('success-green');
                showFeedback("Correct! You nailed it.", "bg-green-500/10 text-green-400 border border-green-500/20");
            } else {
                selectedBtn.classList.add('cherry-red');
                
                // Reveal the correct button
                Array.from(optionsGrid.children).forEach(btn => {
                    if (btn.innerText.trim() === correctValue) {
                        btn.classList.add('border-green-500', 'text-green-400', 'bg-green-500/5');
                    }
                });
                showFeedback(`Oops! The correct answer was ${correctValue}.`, "bg-red-500/10 text-red-400 border border-red-500/20");
            }

            nextBtn.classList.remove('hidden');
        }

        function showFeedback(text, classes) {
            feedback.innerText = text;
            feedback.className = `mt-8 p-4 rounded-2xl text-center font-bold text-sm ${classes}`;
            feedback.classList.remove('hidden');
        }

        nextBtn.onclick = generateQuestion;

        window.onload = initQuiz;
    </script>
</body>
</html>

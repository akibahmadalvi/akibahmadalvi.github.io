<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Alkane Quiz - Organic Chemistry</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --border: #27272a;
            --nav-glass: rgba(10, 10, 12, 0.9);
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Navigation --- */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10%;
            background: var(--nav-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.5px;
            color: var(--text-primary);
            text-decoration: none;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            color: var(--accent);
        }

        /* --- Quiz Layout --- */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        .hidden { display: none !important; }

        /* --- Content Styling --- */
        .badge {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(99, 102, 241, 0.3);
            margin-bottom: 20px;
            display: inline-block;
        }

        h2 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        p.desc {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* --- Buttons --- */
        .btn-primary {
            display: block;
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        /* --- Quiz UI --- */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
        }

        .progress-box {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 700;
        }

        .score-box {
            background: var(--accent-glow);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        #question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            min-height: 80px;
        }

        .option-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 16px;
            border-radius: 16px;
            text-align: left;
            font-family: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--text-secondary);
        }

        /* Feedback States */
        .success-state {
            background: var(--success) !important;
            border-color: var(--success) !important;
            color: white !important;
        }

        .error-state {
            background: var(--error) !important;
            border-color: var(--error) !important;
            color: white !important;
        }

        .reveal-state {
            border-color: var(--success) !important;
            color: var(--success) !important;
            background: rgba(34, 197, 94, 0.05) !important;
        }

        #feedback-area {
            margin-top: 1.5rem;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            nav { padding: 0 5%; }
            .glass-card { padding: 30px 20px; }
            h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Portfolio</a>
        <a href="index.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            Home
        </a>
    </nav>

    <main>
        <!-- Start Screen -->
        <div id="start-screen" class="glass-card">
            <div class="badge">Organic Chemistry</div>
            <h2>Alkane Quiz</h2>
            <p class="desc">Master the naming and carbon counts for Alkanes 1-12. 24 non-repeating questions in a randomized deck.</p>
            <button id="begin-quiz-btn" class="btn-primary">Start Quiz</button>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="glass-card hidden">
            <div class="quiz-header">
                <div>
                    <div class="progress-box" id="progress-text">Question 1/24</div>
                    <div style="font-size: 1.1rem; font-weight: 800; letter-spacing: -0.5px;">ChemQuiz</div>
                </div>
                <div class="score-box">Score: <span id="score">0</span></div>
            </div>

            <div id="question-text">Loading question...</div>

            <div id="options-grid" class="option-grid">
                <!-- Options injected here -->
            </div>

            <div id="feedback-area" class="hidden"></div>

            <button id="next-btn" class="btn-primary hidden" style="margin-top: 2rem; background: white; color: black;">Continue &rarr;</button>
        </div>
    </main>

    <script>
        const carbonData = [
            { carbons: 1, name: "Methane" },
            { carbons: 2, name: "Ethane" },
            { carbons: 3, name: "Propane" },
            { carbons: 4, name: "Butane" },
            { carbons: 5, name: "Pentane" },
            { carbons: 6, name: "Hexane" },
            { carbons: 7, name: "Heptane" },
            { carbons: 8, name: "Octane" },
            { carbons: 9, name: "Nonane" },
            { carbons: 10, name: "Decane" },
            { carbons: 11, name: "Undecane" },
            { carbons: 12, name: "Dodecane" }
        ];

        let questionDeck = [];
        let currentQuestion = null;
        let score = 0;
        let hasAnswered = false;

        const startScreen = document.getElementById('start-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const beginBtn = document.getElementById('begin-quiz-btn');
        const questionText = document.getElementById('question-text');
        const optionsGrid = document.getElementById('options-grid');
        const nextBtn = document.getElementById('next-btn');
        const scoreDisplay = document.getElementById('score');
        const feedbackArea = document.getElementById('feedback-area');
        const progressText = document.getElementById('progress-text');

        function createDeck() {
            let deck = [];
            carbonData.forEach((item, index) => {
                deck.push({ carbonIndex: index, type: 0 }); 
                deck.push({ carbonIndex: index, type: 1 }); 
            });
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startQuiz() {
            startScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            questionDeck = createDeck();
            generateQuestion();
        }

        function generateQuestion() {
            if (questionDeck.length === 0) {
                questionDeck = createDeck();
            }

            hasAnswered = false;
            nextBtn.classList.add('hidden');
            feedbackArea.classList.add('hidden');
            
            const questionSpec = questionDeck.pop();
            const target = carbonData[questionSpec.carbonIndex];
            const type = questionSpec.type;
            
            let questionHtml = "";
            let correctAnswer = "";
            let options = [];

            if (type === 0) {
                questionHtml = `<span style="color:var(--accent)">${target.name}</span> has —`;
                correctAnswer = `${target.carbons} Carbon${target.carbons > 1 ? 's' : ''}`;
                const distractors = carbonData.filter(c => c.carbons !== target.carbons).sort(() => 0.5 - Math.random()).slice(0, 3).map(c => `${c.carbons} Carbon${c.carbons > 1 ? 's' : ''}`);
                options = [correctAnswer, ...distractors];
            } else {
                questionHtml = `<span style="color:var(--accent)">${target.carbons} Carbon</span> Alkane is —`;
                correctAnswer = target.name;
                const distractors = carbonData.filter(c => c.name !== target.name).sort(() => 0.5 - Math.random()).slice(0, 3).map(c => c.name);
                options = [correctAnswer, ...distractors];
            }

            options.sort(() => 0.5 - Math.random());
            currentQuestion = { correctAnswer };
            progressText.innerText = `Question ${24 - questionDeck.length}/24`;

            questionText.innerHTML = questionHtml;
            optionsGrid.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = option;
                btn.onclick = () => handleAnswer(btn);
                optionsGrid.appendChild(btn);
            });
        }

        function handleAnswer(selectedBtn) {
            if (hasAnswered) return;
            hasAnswered = true;

            const selectedValue = selectedBtn.innerText.trim();
            const correctValue = currentQuestion.correctAnswer.trim();
            const isCorrect = selectedValue === correctValue;
            
            if (isCorrect) {
                score++;
                scoreDisplay.innerText = score;
                selectedBtn.classList.add('success-state');
                showFeedback("Correct! Well done.", "rgba(34, 197, 94, 0.1)", "var(--success)");
            } else {
                selectedBtn.classList.add('error-state');
                Array.from(optionsGrid.children).forEach(btn => {
                    if (btn.innerText.trim() === correctValue) {
                        btn.classList.add('reveal-state');
                    }
                });
                showFeedback(`Incorrect. It was ${correctValue}.`, "rgba(239, 68, 68, 0.1)", "var(--error)");
            }
            nextBtn.classList.remove('hidden');
        }

        function showFeedback(text, bg, color) {
            feedbackArea.innerText = text;
            feedbackArea.style.backgroundColor = bg;
            feedbackArea.style.color = color;
            feedbackArea.classList.remove('hidden');
        }

        beginBtn.onclick = startQuiz;
        nextBtn.onclick = generateQuestion;
    </script>
</body>
</html>
